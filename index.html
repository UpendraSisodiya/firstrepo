<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proposal 💖</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin-top: 100px;
      color: #fff;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: absolute;
      transition: 0.3s;
    }

    #yesBtn {
      background-color: #28a745;
      color: white;
      left: 40%;
      top: 50%;
    }

    #noBtn {
      background-color: #dc3545;
      color: white;
      left: 55%;
      top: 50%;
    }

    #popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .heart {
      font-size: 50px;
      animation: pop 1s infinite;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<h1>Will you be mine? ❤️</h1>

<button id="yesBtn">Yess💖</button>
<button id="noBtn">Noaa 😢</button>

<div id="popup">
  <div class="heart">💖🎉💖</div>
  <h2>Yayyyy!!! 🥳</h2>
  <p>
    Tumne haan bol diya 🥹❤️<br>
    Ab to officially tum meri ho 💍💖<br><br>
    I promise to make you smile everyday 😊
  </p>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const popup = document.getElementById("popup");

  // Naa button bhagega
  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  // Haan click → celebration
  yesBtn.addEventListener("click", () => {
    popup.style.display = "block";

    // confetti effect simple
    for (let i = 0; i < 30; i++) {
      let span = document.createElement("span");
      span.innerHTML = "🎈";
      span.style.position = "absolute";
      span.style.left = Math.random() * window.innerWidth + "px";
      span.style.top = "-50px";
      span.style.fontSize = "30px";
      document.body.appendChild(span);

      let fall = setInterval(() => {
        span.style.top = (span.offsetTop + 5) + "px";
        if (span.offsetTop > window.innerHeight) {
          clearInterval(fall);
          span.remove();
        }
      }, 30);
    }
  });
</script>

</body>
</html>
